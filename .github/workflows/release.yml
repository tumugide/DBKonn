name: Release

on:
  push:
    branches: [ "main" ]

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release-macos:
    name: Build & Release (macOS - Apple Silicon)
    runs-on: macos-14
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: ". -> target"

      - name: Install tauri-cli
        run: cargo install tauri-cli --version "^2.0.0"

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Install frontend dependencies
        working-directory: app
        run: bun install --frozen-lockfile

      - name: Read app version
        id: version
        run: echo "version=$(jq -r .version app/src-tauri/tauri.conf.json)" >> "$GITHUB_OUTPUT"

      - name: Build macOS (Apple Silicon)
        working-directory: app/src-tauri
        run: cargo tauri build --target aarch64-apple-darwin

      - name: Create/Update GitHub Release
        uses: softprops/action-gh-release@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: v${{ steps.version.outputs.version }}
          name: DBKonn v${{ steps.version.outputs.version }}
          draft: false
          prerelease: false
          files: |
            target/aarch64-apple-darwin/release/bundle/dmg/*.dmg

