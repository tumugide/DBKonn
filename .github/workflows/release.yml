name: Release

on:
  push:
    branches: [ "main" ]

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # ---------------------------------------------------------------------
  # Every merge to main becomes a new patch release. The version is
  # DERIVED from the latest v* git tag (v0.1.4 -> v0.1.5) and stamped
  # into the source files inside the CI workspace only — nothing is
  # pushed back to main, so the branch ruleset never gets in the way.
  # The committed version fields are just a starting floor; the real
  # version lives in the git tags and the published releases.
  # ---------------------------------------------------------------------
  version:
    name: Compute next version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.next.outputs.version }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Compute next patch version
        id: next
        run: |
          set -euo pipefail
          latest="$(git tag --list 'v[0-9]*' --sort=-v:refname | head -n1)"
          if [ -z "$latest" ]; then
            base="$(jq -r .version app/src-tauri/tauri.conf.json)"
          else
            base="${latest#v}"
          fi
          IFS='.' read -r major minor patch <<< "$base"
          patch=$((patch + 1))
          next="${major}.${minor}.${patch}"
          echo "Latest tag: ${latest:-<none>}  ->  next version: ${next}"
          echo "version=${next}" >> "$GITHUB_OUTPUT"

  release-macos:
    name: Build & Release (macOS - Apple Silicon)
    needs: version
    runs-on: macos-14
    env:
      APP_VERSION: ${{ needs.version.outputs.version }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: ". -> target"

      - name: Install tauri-cli
        run: cargo install tauri-cli --version "^2.0.0"

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Install frontend dependencies
        working-directory: app
        run: bun install --frozen-lockfile

      - name: Stamp version
        run: |
          set -euo pipefail
          v="$APP_VERSION"
          # Workspace crate version — covers core, cli and app,
          # which all inherit it via `version.workspace = true`.
          sed -i.bak -E "s/^version = \"[^\"]+\"/version = \"$v\"/" Cargo.toml && rm Cargo.toml.bak
          # Tauri bundle + in-app updater version.
          jq --arg v "$v" '.version = $v' app/src-tauri/tauri.conf.json > tauri.tmp && mv tauri.tmp app/src-tauri/tauri.conf.json
          # Frontend package version.
          jq --arg v "$v" '.version = $v' app/package.json > pkg.tmp && mv pkg.tmp app/package.json
          echo "Stamped version $v:"
          grep -n '^version = ' Cargo.toml
          jq -r '.version' app/src-tauri/tauri.conf.json
          jq -r '.version' app/package.json

      - name: Build macOS (Apple Silicon)
        working-directory: app/src-tauri
        run: cargo tauri build --target aarch64-apple-darwin

      - name: Create/Update GitHub Release
        uses: softprops/action-gh-release@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: v${{ env.APP_VERSION }}
          name: DBKonn v${{ env.APP_VERSION }}
          draft: false
          prerelease: false
          files: |
            target/aarch64-apple-darwin/release/bundle/dmg/*.dmg

